<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#444444" />
    </marker>
  </defs>

  <!-- Title & Metadata -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">[Diagrama de Contexto de Sistema - C4 Nivel 1]</text>
  <text x="500" y="65" text-anchor="middle" font-size="14" fill="#555555">Plataforma de Inscripción Académica (PIA) - Universidad de la Salle</text>

  <!-- Boundaries & Grouping -->
  <rect x="50" y="90" width="900" height="460" rx="10" fill="#fcfcfc" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="5 5" />
  <text x="70" y="115" font-size="13" font-weight="bold" fill="#777777">Límite Institucional - Universidad de la Salle</text>

  <!-- ACTOR 1: Estudiante -->
  <g transform="translate(100, 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="150" rx="8" fill="#08427b" stroke="#06325d" stroke-width="2"/>
    <circle cx="100" cy="35" r="16" fill="#ffffff" opacity="0.9"/>
    <path d="M 80 62 A 20 20 0 0 1 120 62 Z" fill="#ffffff" opacity="0.9"/>
    <text x="100" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Estudiante</text>
    <text x="100" y="103" text-anchor="middle" font-size="12" fill="#d1e3f8">[Persona - ~24.000]</text>
    <text x="100" y="125" text-anchor="middle" font-size="11" fill="#ffffff">Consulta asignaturas, inscribe</text>
    <text x="100" y="139" text-anchor="middle" font-size="11" fill="#ffffff">cupos y cancela materias</text>
  </g>

  <!-- ACTOR 2: Coordinador / Auditor -->
  <g transform="translate(100, 390)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="130" rx="8" fill="#08427b" stroke="#06325d" stroke-width="2"/>
    <circle cx="100" cy="30" r="14" fill="#ffffff" opacity="0.9"/>
    <path d="M 82 54 A 18 18 0 0 1 118 54 Z" fill="#ffffff" opacity="0.9"/>
    <text x="100" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Coordinador / Auditor</text>
    <text x="100" y="92" text-anchor="middle" font-size="12" fill="#d1e3f8">[Persona - 5 Facultades]</text>
    <text x="100" y="112" text-anchor="middle" font-size="11" fill="#ffffff">Supervisa cupos y audita</text>
  </g>

  <!-- SYSTEM IN FOCUS: PIA -->
  <g transform="translate(390, 210)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="180" rx="10" fill="#1168bd" stroke="#0b4884" stroke-width="3"/>
    <text x="120" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Plataforma PIA</text>
    <text x="120" y="62" text-anchor="middle" font-size="12" fill="#d1e3f8">[Sistema de Software]</text>
    <text x="120" y="88" text-anchor="middle" font-size="11" fill="#ffffff">Administra las inscripciones del</text>
    <text x="120" y="104" text-anchor="middle" font-size="11" fill="#ffffff">período, controla cupos atómicos</text>
    <text x="120" y="120" text-anchor="middle" font-size="11" fill="#ffffff">y asegura 0 sobrecupos e idempotencia.</text>
    <rect x="20" y="135" width="200" height="30" rx="4" fill="#0b4884" />
    <text x="120" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#a9d2fb">Linux + PostgreSQL (C08)</text>
  </g>

  <!-- EXTERNAL SYSTEM: Sistema Legado -->
  <g transform="translate(710, 225)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#999999" stroke="#666666" stroke-width="2"/>
    <text x="110" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Sistema Académico</text>
    <text x="110" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Legado</text>
    <text x="110" y="80" text-anchor="middle" font-size="12" fill="#f0f0f0">[Sistema Externo - >12 años]</text>
    <text x="110" y="105" text-anchor="middle" font-size="11" fill="#ffffff">Fuente oficial de historial,</text>
    <text x="110" y="121" text-anchor="middle" font-size="11" fill="#ffffff">mallas y prerrequisitos (C05)</text>
  </g>

  <!-- RELATIONSHIPS -->
  <!-- Estudiante -> PIA -->
  <path d="M 300 270 L 390 270" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="255" text-anchor="middle" font-size="11" fill="#222222">Inscribe/Consulta</text>
  <text x="345" y="290" text-anchor="middle" font-size="10" fill="#666666">[HTTPS/JSON]</text>

  <!-- Auditor -> PIA -->
  <path d="M 300 450 L 510 450 L 510 390" stroke="#444444" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="405" y="435" text-anchor="middle" font-size="11" fill="#222222">Consulta auditoría y reportes</text>
  <text x="405" y="470" text-anchor="middle" font-size="10" fill="#666666">[HTTPS/Web]</text>

  <!-- PIA -> Sistema Legado -->
  <path d="M 630 270 L 710 270" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="255" text-anchor="middle" font-size="11" fill="#222222">Sincronización</text>
  <text x="670" y="285" text-anchor="middle" font-size="10" fill="#666666">Asíncrona (Outbox)</text>

  <!-- Sistema Legado -> PIA (Pre-carga) -->
  <path d="M 710 330 L 630 330" stroke="#444444" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="670" y="320" text-anchor="middle" font-size="11" fill="#222222">Pre-carga Kárdex</text>
  <text x="670" y="350" text-anchor="middle" font-size="10" fill="#666666">(Batch T-24h)</text>

  <!-- LEGEND -->
  <g transform="translate(60, 570)">
    <rect x="0" y="0" width="880" height="55" rx="6" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1"/>
    <text x="20" y="32" font-size="12" font-weight="bold" fill="#333333">Convenciones C4:</text>
    
    <rect x="150" y="18" width="20" height="20" rx="3" fill="#08427b"/>
    <text x="180" y="33" font-size="11" fill="#444444">Persona (Usuario)</text>

    <rect x="330" y="18" width="20" height="20" rx="3" fill="#1168bd"/>
    <text x="360" y="33" font-size="11" fill="#444444">Sistema de Software (En Foco)</text>

    <rect x="580" y="18" width="20" height="20" rx="3" fill="#999999"/>
    <text x="610" y="33" font-size="11" fill="#444444">Sistema Externo (Legado)</text>
  </g>
</svg>
